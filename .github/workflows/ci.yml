name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catch archive.org layout changes or a new dump that breaks parsing.
    - cron: "17 6 * * 2"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "ruff==0.16.0" "mypy==2.3.0" ".[test]"
      - run: ruff check src tests
      - run: mypy --strict src
      - run: pytest tests -v

  real-wiki:
    # Downloads the real dump from archive.org, builds the index, and checks
    # search ranking on questions OS developers actually ask.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - run: osdev-wiki-mcp --update
        env:
          OSDEV_WIKI_DIR: ${{ runner.temp }}/osdev-wiki
      - run: pytest tests/test_real_wiki.py -v
        env:
          OSDEV_WIKI_REAL_DIR: ${{ runner.temp }}/osdev-wiki
